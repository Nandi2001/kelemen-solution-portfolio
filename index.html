<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101c22" />
  <meta name="description" content="Kelemen Solutions — engineering, design and automation. Website coming soon." />
  <title>Kelemen Solutions | Coming Soon</title>
  <style>
    :root { color-scheme: dark; --bg: #101c22; --surface: #192a32; --fg: #edf6f5; --muted: #adc2c3; --accent: #57cabc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 28%, #203a41 0%, var(--bg) 65%); color: var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 600px); text-align: center; }
    .mark { width: 86px; height: 86px; display: grid; place-items: center; margin: 0 auto 32px; border: 1px solid #3e7776; background: #173139; border-radius: 24px; color: var(--accent); box-shadow: 0 18px 70px #0004; }
    .mark svg { width: 47px; height: 47px; }
    .eyebrow { margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(38px, 8vw, 66px); letter-spacing: -.055em; line-height: 1.08; font-weight: 750; }
    h1 span { color: var(--accent); }
    .subtitle { margin: 22px auto 0; max-width: 480px; color: var(--muted); font-size: clamp(16px, 2.8vw, 19px); line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 35px; padding: 11px 17px; border: 1px solid #355653; border-radius: 100px; background: #17302e; color: #d9f7ed; font-size: 13px; font-weight: 600; }
    .status-dot { width: 9px; height: 9px; background: #69dbad; border-radius: 50%; box-shadow: 0 0 0 5px #69dbad1c; }
    footer { margin-top: 62px; color: #809d9e; font-size: 13px; letter-spacing: .025em; }
    @media (prefers-reduced-motion: no-preference) { .status-dot { animation: glow 2s ease-in-out infinite; } @keyframes glow { 50% { box-shadow: 0 0 0 9px #69dbad0a; } } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <!-- Construction icon: simple, self-contained SVG; no external files needed -->
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" role="img">
        <path d="M12 33 30 15"/>
        <path d="M28 9a10 10 0 0 0-13 13L6 31a5 5 0 0 0 7 7l9-9A10 10 0 0 0 35 16l-6 6-7-7 6-6Z"/>
        <path d="m30 33 5 5m-1-13 9 9"/>
      </svg>
    </div>
    <p class="eyebrow">Engineering · Design · Automation</p>
    <h1>Kelemen <span>Solutions</span></h1>
    <p class="subtitle">We're building something new. Our portfolio and services will be available here soon.</p>
    <div class="status"><span class="status-dot"></span>Work in progress · Hosting is working!</div>
    <footer>© <span id="year">2026</span> Kelemen Solutions</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
